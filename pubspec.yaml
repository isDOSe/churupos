name: churupos
description: "Calculadora de cambio de divisas para Venezuela."
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/branding/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app-icon-legacy.png"
  adaptive_icon_background: "assets/branding/app-icon-background.png"
  adaptive_icon_foreground: "assets/branding/app-icon-foreground.png"
  adaptive_icon_monochrome: "assets/branding/app-icon-monochrome.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 23
